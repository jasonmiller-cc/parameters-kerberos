name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: src/parameters-kerberos

      - name: Checkout parameters-core (replace directive)
        uses: actions/checkout@v4
        with:
          repository: jasonmiller-cc/parameters-core
          path: src/parameters-core
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.27.1"
          cache: true
          cache-dependency-path: src/parameters-kerberos/go.sum

      - name: Tidy
        working-directory: src/parameters-kerberos
        run: go mod tidy

      - name: Vet
        working-directory: src/parameters-kerberos
        run: go vet ./...

      - name: Build
        working-directory: src/parameters-kerberos
        run: go build ./...

      - name: Test
        working-directory: src/parameters-kerberos
        run: go test ./...
